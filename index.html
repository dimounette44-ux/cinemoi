<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinéMoi</title>
<meta name="theme-color" content="#09090f">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#09090f;color:#fff}header{padding:22px 15px 15px;background:linear-gradient(#171724,#09090f);position:sticky;top:0;z-index:10}.logo{text-align:center;font-size:30px;font-weight:800}.logo span{color:#e50914}.sub{text-align:center;color:#aaa;margin:5px 0 15px;font-size:14px}.search{display:flex;gap:8px;max-width:700px;margin:auto}input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #333;background:#171722;color:#fff;font-size:16px}button{padding:12px 15px;border:0;border-radius:12px;background:#e50914;color:white;font-weight:bold}nav{display:flex;gap:8px;max-width:700px;margin:12px auto 0}nav button{flex:1;background:#20202c;border:1px solid #333}nav button.active{background:#e50914}main{max-width:1100px;margin:auto;padding:18px 12px 45px}.titlebar{display:flex;justify-content:space-between;align-items:center;margin:5px 3px 14px}h2{margin:0;font-size:22px}.status{font-size:13px;color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}.card{background:#15151f;border:1px solid #282833;border-radius:14px;overflow:hidden}.poster{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}.info{padding:9px}.name{font-size:14px;font-weight:bold;line-height:1.25;min-height:35px}.meta{font-size:12px;color:#aaa;margin-top:5px}.rating{font-size:13px;color:#ffd166;margin-top:5px}.message{grid-column:1/-1;text-align:center;padding:35px 10px;color:#aaa}.error{color:#ff8c8c}.hidden{display:none}.settings{margin-top:28px;padding:14px;border:1px solid #292933;border-radius:14px;background:#12121b}.settings summary{font-weight:bold;cursor:pointer}.keyrow{display:flex;gap:8px;margin-top:12px}.small{font-size:12px;color:#888;line-height:1.4;margin-top:8px}footer{text-align:center;color:#666;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<div class="logo">Ciné<span>Moi</span> 🎬</div>
<div class="sub">Ton espace films et séries</div>
<div class="search"><input id="search" type="search" placeholder="Rechercher un film ou une série..."><button id="searchBtn">Rechercher</button></div>
<nav><button id="filmsBtn" class="active">🎬 Films</button><button id="seriesBtn">📺 Séries</button></nav>
</header>
<main>
<section id="filmsSection"><div class="titlebar"><h2>🎬 Films</h2><span id="filmsStatus" class="status"></span></div><div id="filmsGrid" class="grid"></div></section>
<section id="seriesSection" class="hidden"><div class="titlebar"><h2>📺 Séries</h2><span id="seriesStatus" class="status"></span></div><div id="seriesGrid" class="grid"></div></section>
<details class="settings"><summary>⚙️ Clé API TMDB</summary><div class="keyrow"><input id="keyInput" type="password" placeholder="Colle ta clé API TMDB ici"><button id="saveKey">Enregistrer</button></div><div class="small">La clé est enregistrée dans le navigateur de ce téléphone. Si ta clé est déjà dans ton ancien code, tu peux la remettre ici.</div></details>
</main>
<footer>CinéMoi utilise les données de The Movie Database (TMDB).</footer>
<script>
const TMDB='https://api.themoviedb.org/3';
const IMG='https://image.tmdb.org/t/p/w500';
/* Si tu veux mettre ta clé directement dans le code, écris-la entre les guillemets ci-dessous. */
const API_KEY='fdbc7014e19fc25d42f2562efda75cc3';
let key=localStorage.getItem('cinemoi_tmdb_key')||API_KEY;
let type='movie';
const $=id=>document.getElementById(id);
$('keyInput').value=key;
function setTab(t){type=t;$('filmsBtn').classList.toggle('active',t==='movie');$('seriesBtn').classList.toggle('active',t==='tv');$('filmsSection').classList.toggle('hidden',t!=='movie');$('seriesSection').classList.toggle('hidden',t!=='tv');loadPopular(t)}
$('filmsBtn').onclick=()=>setTab('movie');
$('seriesBtn').onclick=()=>setTab('tv');
$('saveKey').onclick=()=>{const v=$('keyInput').value.trim();if(!v){alert('Colle ta clé API TMDB.');return}key=v;localStorage.setItem('cinemoi_tmdb_key',v);alert('Clé API enregistrée !');loadPopular(type)};
$('searchBtn').onclick=search;
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
async function api(path,params={}){const u=new URL(TMDB+path);u.searchParams.set('api_key',key);u.searchParams.set('language','fr-FR');for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);const r=await fetch(u);if(!r.ok)throw Error('TMDB '+r.status);return r.json()}
function msg(t,text,error=false){const g=$(t==='movie'?'filmsGrid':'seriesGrid');g.innerHTML='<div class="message '+(error?'error':'')+'">'+escapeHtml(text)+'</div>'}
async function loadPopular(t){if(!key){msg(t,'Ajoute ta clé API TMDB dans « ⚙️ Clé API TMDB ».');return}$(t==='movie'?'filmsStatus':'seriesStatus').textContent='Chargement…';try{const d=await api(t==='movie'?'/movie/popular':'/tv/popular',{page:1,region:'FR'});render(t,d.results||[])}catch(e){msg(t,'Impossible de charger TMDB. Vérifie ta clé API et ta connexion.',true)}$(t==='movie'?'filmsStatus':'seriesStatus').textContent=''}
async function search(){if(!key){msg(type,'Ajoute ta clé API TMDB dans « ⚙️ Clé API TMDB ».');return}const q=$('search').value.trim();if(!q){loadPopular(type);return}$(type==='movie'?'filmsStatus':'seriesStatus').textContent='Recherche…';try{const d=await api('/search/'+type,{query:q,page:1,include_adult:'false'});render(type,d.results||[])}catch(e){msg(type,'La recherche a échoué. Vérifie ta clé API.',true)}$(type==='movie'?'filmsStatus':'seriesStatus').textContent=''}
function render(t,items){const g=$(t==='movie'?'filmsGrid':'seriesGrid');if(!items.length){msg(t,'Aucun résultat trouvé.');return}g.innerHTML=items.map(x=>{const title=escapeHtml(t==='movie'?x.title:x.name);const date=t==='movie'?x.release_date:x.first_air_date;const year=date?date.slice(0,4):'—';const rating=x.vote_average?Number(x.vote_average).toFixed(1):'—';const poster=x.poster_path?IMG+x.poster_path:'https://via.placeholder.com/500x750/222/fff?text=Pas+d%27affiche';return `<article class="card"><img class="poster" src="${poster}" alt="${title}" loading="lazy"><div class="info"><div class="name">${title}</div><div class="meta">${year}</div><div class="rating">⭐ ${rating}/10</div></div></article>`}).join('')}
function escapeHtml(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
loadPopular('movie');
</script>
</body>
</html>
